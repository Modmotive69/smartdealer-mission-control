name: Deploy MC to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deploy at a time. A newer sync push cancels any in-flight
# run instead of piling up colliding builds. The colliding legacy builds
# were the root cause of the ~144 build runs/day + transient-flake email flood.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
